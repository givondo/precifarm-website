<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="'Segoe UI',system-ui,sans-serif" data-pf-theme="v2">
<style>
.t{fill:#0a0a0a}.s{fill:#737373}
.tiny{font-size:9.5px;fill:#737373}
.hd{font-size:10.5px;font-weight:700;letter-spacing:.1em}

.pf-accent{fill:#2563eb}
.pf-frame{fill:none;stroke:#e2e8f0;stroke-width:1}
.bx,.dev{filter:url(#pf-shadow-sm)}
.bxb{filter:url(#pf-shadow);fill:#f8fbff}

</style>
<defs>
<linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f8fafc"/>
  <stop offset="55%" stop-color="#ffffff"/>
  <stop offset="100%" stop-color="#f1f5f9"/>
</linearGradient>
<pattern id="pf-grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="0.75" fill="#e2e8f0"/>
</pattern>
<linearGradient id="pf-blue" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#3b82f6"/>
  <stop offset="100%" stop-color="#1d4ed8"/>
</linearGradient>
<linearGradient id="pf-blue-soft" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#eff6ff"/>
  <stop offset="100%" stop-color="#dbeafe"/>
</linearGradient>
<filter id="pf-shadow" x="-8%" y="-8%" width="116%" height="120%">
  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
</filter>
<filter id="pf-shadow-sm" x="-6%" y="-6%" width="112%" height="114%">
  <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
</filter>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs>

<g id="pf-background" aria-hidden="true">
  <rect width="1200" height="680" fill="url(#pf-bg)"/>
  <rect width="1200" height="680" fill="url(#pf-grid)" opacity="0.45"/>
  <rect x="0" y="0" width="5" height="680" fill="#2563eb" rx="0"/>
</g><text x="40" y="42" class="t" font-size="20" font-weight="700">PAYGO and M-Pesa &#8212; financial-energy architecture</text>
<text x="40" y="64" class="s" font-size="12.5">The payment rail already exists. The engineering question is not how to collect money &#8212; it is what the device is permitted to do when money is late.</text>


<!-- ===== LEFT: flow ===== -->
<text x="40" y="112" class="hd" fill="#0a0a0a">PAYMENT TO DEVICE POLICY</text>
<g transform="translate(40,124)">
<rect x="0" y="0" width="300" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="16" y="22" font-size="12.5" font-weight="700" fill="#1d4ed8">CUSTOMER</text>
<text x="16" y="39" class="tiny">initiates payment when they choose</text>
<path d="M150 48 V 76" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)" fill="none"/>
<text x="162" y="66" class="tiny">M-Pesa paybill</text>

<rect x="0" y="76" width="300" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="16" y="98" font-size="12.5" font-weight="700" fill="#065f46">M-PESA</text>
<text x="16" y="115" class="tiny">existing national rail &#8212; no new infrastructure</text>
<path d="M150 124 V 152" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)" fill="none"/>

<rect x="0" y="152" width="300" height="48" rx="6" fill="#fff" stroke="#0a0a0a" stroke-width="1.4"/>
<text x="16" y="174" font-size="12.5" font-weight="700">PRECIFARM ACCOUNT</text>
<text x="16" y="191" class="tiny">one account across P1, P2 and Pod &#183; CMS ledger</text>
<path d="M150 200 V 228" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)" fill="none"/>

<rect x="0" y="228" width="300" height="48" rx="6" fill="#fff" stroke="#0a0a0a" stroke-width="1.4"/>
<text x="16" y="250" font-size="12.5" font-weight="700">PAYGO ENGINE</text>
<text x="16" y="267" class="tiny">credit state &#183; grace window &#183; arrears &#183; audit log</text>
<path d="M150 276 V 304" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)" fill="none"/>

<rect x="0" y="304" width="300" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="16" y="326" font-size="12.5" font-weight="700" fill="#1d4ed8">ENERGY OS</text>
<text x="16" y="343" class="tiny">policy evaluation &#183; signed service token &#183; audit</text>
<path d="M150 352 V 380" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)" fill="none"/>

<rect x="0" y="380" width="300" height="60" rx="6" fill="#0a0a0a"/>
<text x="16" y="402" font-size="12.5" font-weight="700" fill="#fff">DEVICE POLICY</text>
<text x="16" y="419" font-size="9.5" fill="#60a5fa">essential-load floor enforcement</text>
<text x="16" y="433" font-size="9.5" fill="#fca5a5" font-weight="700">NOT a hard remote kill switch</text>
</g>

<!-- barrier callout -->
<g transform="translate(360,504)">
<rect x="0" y="0" width="300" height="0"/>
</g>

<!-- ===== RIGHT: state machine ===== -->
<text x="380" y="112" class="hd" fill="#0a0a0a">ARREARS STATE MACHINE  &#183;  [PROPOSED]  &#183;  DECISION E-08 PENDING LEGAL SIGN-OFF</text>
<g transform="translate(380,124)">
<g class="hd" fill="#737373" font-size="9">
<text x="0" y="14">STATE</text><text x="140" y="14">TRIGGER</text><text x="270" y="14">DEVICE BEHAVIOUR</text><text x="700" y="14">ESSENTIAL LOADS</text>
</g>
<line x1="0" y1="22" x2="780" y2="22" stroke="#e5e5e5"/>
<g font-size="10.5">
<g><rect x="0" y="30" width="780" height="30" rx="4" fill="#ecfdf5"/>
<text x="10" y="50" font-weight="700" fill="#065f46">ACTIVE</text><text x="140" y="50" fill="#404040">paid up</text><text x="270" y="50" fill="#404040">Full capability</text><text x="700" y="50" font-weight="700" fill="#059669">ON</text></g>
<g><rect x="0" y="64" width="780" height="30" rx="4" fill="#ecfdf5"/>
<text x="10" y="84" font-weight="700" fill="#065f46">REMINDER</text><text x="140" y="84" fill="#404040">5 days before due</text><text x="270" y="84" fill="#404040">Full capability &#183; SMS and in-app notice</text><text x="700" y="84" font-weight="700" fill="#059669">ON</text></g>
<g><rect x="0" y="98" width="780" height="30" rx="4" fill="#f0fdf4"/>
<text x="10" y="118" font-weight="700" fill="#065f46">DUE</text><text x="140" y="118" fill="#404040">payment date</text><text x="270" y="118" fill="#404040">Full capability</text><text x="700" y="118" font-weight="700" fill="#059669">ON</text></g>
<g><rect x="0" y="132" width="780" height="30" rx="4" fill="#fffbeb"/>
<text x="10" y="152" font-weight="700" fill="#b45309">GRACE</text><text x="140" y="152" fill="#404040">1&#8211;7 days late</text><text x="270" y="152" fill="#404040">Full capability &#183; daily SMS with paybill details</text><text x="700" y="152" font-weight="700" fill="#059669">ON</text></g>
<g><rect x="0" y="166" width="780" height="44" rx="4" fill="#fff7ed"/>
<text x="10" y="186" font-weight="700" fill="#9a3412">RESTRICTED</text><text x="140" y="186" fill="#404040">8&#8211;21 days late</text>
<text x="270" y="186" fill="#404040">Discretionary high-power loads and EV charging</text>
<text x="270" y="200" fill="#404040">disabled. Clear explanation of how to restore.</text>
<text x="700" y="186" font-weight="700" fill="#059669">ON</text><text x="700" y="200" font-size="9" fill="#059669">floor maintained</text></g>
<g><rect x="0" y="214" width="780" height="44" rx="4" fill="#fef2f2"/>
<text x="10" y="234" font-weight="700" fill="#991b1b">SUSPENDED</text><text x="140" y="234" fill="#404040">&gt; 21 days late</text>
<text x="270" y="234" fill="#404040">Discretionary capability off. The customer's own</text>
<text x="270" y="248" fill="#404040">solar generation continues to work.</text>
<text x="700" y="234" font-weight="700" fill="#059669">ON</text><text x="700" y="248" font-size="9" fill="#059669">floor retained</text></g>
<g><rect x="0" y="262" width="780" height="44" rx="4" fill="#f5f5f5"/>
<text x="10" y="282" font-weight="700" fill="#0a0a0a">RECOVERY</text><text x="140" y="282" fill="#404040">field process</text>
<text x="270" y="282" fill="#404040">A physical process with written notice &#8212; never</text>
<text x="270" y="296" fill="#404040">remote bricking. Documented and auditable.</text>
<text x="700" y="282" font-size="9.5" fill="#404040">per legal process</text></g>
</g>
</g>

<!-- essential load definition -->
<g transform="translate(380,450)">
<rect x="0" y="0" width="380" height="112" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="18" y="24" class="hd" fill="#065f46">THE ESSENTIAL-LOAD FLOOR</text>
<line x1="18" y1="32" x2="362" y2="32" stroke="#a7f3d0"/>
<g font-size="10.5" fill="#065f46">
<text x="18" y="52">&#183; Lighting</text><text x="200" y="52">&#183; Refrigeration circuit</text>
<text x="18" y="70">&#183; Phone charging</text><text x="200" y="70">&#183; Wi-Fi router</text>
<text x="18" y="88">&#183; Security / gate controller</text>
</g>
<text x="18" y="106" font-size="9.5" fill="#047857" font-style="italic">Exact wattage and circuit definition is a legal question, not an engineering preference &#8212; E-08.</text>
</g>

<!-- non-negotiable rules -->
<g transform="translate(780,450)">
<rect x="0" y="0" width="380" height="112" rx="7" fill="#0a0a0a"/>
<text x="18" y="24" class="hd" fill="#fff">SEVEN NON-NEGOTIABLE RULES</text>
<line x1="18" y1="32" x2="362" y2="32" stroke="#404040"/>
<g font-size="9.5" fill="#e5e5e5">
<text x="18" y="48">1 &#183; No hard cutoff &#8212; a floor is retained at every state</text>
<text x="18" y="62">2 &#183; PAYGO can never affect a protection function</text>
<text x="18" y="76">3 &#183; A customer's own solar is never disabled by arrears</text>
<text x="18" y="90">4 &#183; Kenyan legal review before launch is mandatory</text>
<text x="18" y="104">5 &#183; Terms published at point of sale &#160;6 &#183; Full audit log &#160;7 &#183; Hardship override</text>
</g>
</g>

<!-- evidence base -->
<g transform="translate(40,580)">
<rect x="0" y="0" width="1120" height="66" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="16" y="22" class="hd" fill="#b45309">WHY THE DESIGN IS SHAPED THIS WAY  &#183;  [BENCHMARK]  &#183;  SOURCED &#167;28</text>
<text x="16" y="40" font-size="10" fill="#92400e">Remote lockout is standard practice in African PAYGO solar and Kenyan law does not currently contain a statute specifically regulating it. Published policy analysis recommends that remote lockout be <tspan font-weight="700">limited but not prohibited</tspan>, precisely because</text>
<text x="16" y="54" font-size="10" fill="#92400e">unrestricted lockout can remove a household's access to light, water or refrigeration. The industry's voluntary GOGLA Consumer Protection Code sets minimum standards. Precifarm should design to the recommendation, not to the current legal minimum.</text>
</g>

<text x="40" y="672" class="s" font-size="10.5">Figure 20 &#8212; PAYGO and M-Pesa architecture. All states and timings are PROPOSED and subject to Kenyan legal opinion (decision E-08, gate P3). State machine validated by test T-25. Reputational and legal exposure is tracked as risk R-07.</text>
</svg>
