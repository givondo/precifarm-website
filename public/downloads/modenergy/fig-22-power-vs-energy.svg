<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'Segoe UI',system-ui,sans-serif" data-pf-theme="v2">
<defs>
<linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f8fafc"/>
  <stop offset="55%" stop-color="#ffffff"/>
  <stop offset="100%" stop-color="#f1f5f9"/>
</linearGradient>
<pattern id="pf-grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="0.75" fill="#e2e8f0"/>
</pattern>
<linearGradient id="pf-blue" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#3b82f6"/>
  <stop offset="100%" stop-color="#1d4ed8"/>
</linearGradient>
<linearGradient id="pf-blue-soft" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#eff6ff"/>
  <stop offset="100%" stop-color="#dbeafe"/>
</linearGradient>
<filter id="pf-shadow" x="-8%" y="-8%" width="116%" height="120%">
  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
</filter>
<filter id="pf-shadow-sm" x="-6%" y="-6%" width="112%" height="114%">
  <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
</filter></defs>
<style>
.t{fill:#0a0a0a}.s{fill:#737373}
.tiny{font-size:9.5px;fill:#737373}
.hd{font-size:10.5px;font-weight:700;letter-spacing:.1em}
.mono{font-size:10px;font-family:ui-monospace,Consolas,monospace;fill:#404040}

.pf-accent{fill:#2563eb}
.pf-frame{fill:none;stroke:#e2e8f0;stroke-width:1}
.bx,.dev{filter:url(#pf-shadow-sm)}
.bxb{filter:url(#pf-shadow);fill:#f8fbff}

</style>

<g id="pf-background" aria-hidden="true">
  <rect width="1200" height="700" fill="url(#pf-bg)"/>
  <rect width="1200" height="700" fill="url(#pf-grid)" opacity="0.45"/>
  <rect x="0" y="0" width="5" height="700" fill="#2563eb" rx="0"/>
</g><text x="40" y="42" class="t" font-size="20" font-weight="700">Energy is the tank. Power is the pipe.</text>
<text x="40" y="64" class="s" font-size="12.5">Conflating kWh and kW is the single most common cause of mis-sold residential storage. A bigger tank does not make water come out faster.</text>


<!-- ===== THE ANALOGY ===== -->
<g transform="translate(60,110)">

<!-- Config 1: 10 kWh / 5 kW -->
<g transform="translate(0,0)">
<text x="130" y="0" class="hd" fill="#404040" text-anchor="middle">BASELINE</text>
<text x="130" y="20" font-size="15" font-weight="700" fill="#0a0a0a" text-anchor="middle">10 kWh / 5 kW</text>
<!-- tank -->
<rect x="60" y="36" width="140" height="180" rx="8" fill="none" stroke="#262626" stroke-width="2.4"/>
<rect x="66" y="60" width="128" height="150" rx="5" fill="#bfdbfe"/>
<path d="M66 60 q32 -8 64 0 q32 8 64 0 v6 q-32 8 -64 0 q-32 -8 -64 0 Z" fill="#93c5fd"/>
<text x="130" y="140" font-size="17" font-weight="700" fill="#1e40af" text-anchor="middle">10 kWh</text>
<text x="130" y="158" font-size="10" fill="#1e40af" text-anchor="middle">ENERGY = TANK SIZE</text>
<!-- pipe -->
<rect x="200" y="180" width="90" height="24" fill="#404040"/>
<rect x="203" y="184" width="84" height="16" fill="#60a5fa"/>
<text x="245" y="222" font-size="11" font-weight="700" fill="#0a0a0a" text-anchor="middle">5 kW</text>
<text x="245" y="236" class="tiny" text-anchor="middle">POWER = PIPE SIZE</text>
<!-- runtime -->
<rect x="30" y="256" width="240" height="44" rx="6" fill="#f5f5f5" stroke="#e5e5e5"/>
<text x="150" y="274" class="mono" font-size="10.5" text-anchor="middle">t = 10 kWh / 5 kW</text>
<text x="150" y="292" font-size="14" font-weight="700" fill="#0a0a0a" text-anchor="middle">2.0 hours</text>
</g>

<!-- Config 2: 20 kWh / 5 kW -->
<g transform="translate(360,0)">
<text x="130" y="0" class="hd" fill="#2563eb" text-anchor="middle">DOUBLE THE ENERGY</text>
<text x="130" y="20" font-size="15" font-weight="700" fill="#0a0a0a" text-anchor="middle">20 kWh / 5 kW</text>
<rect x="30" y="36" width="200" height="180" rx="8" fill="none" stroke="#2563eb" stroke-width="2.4"/>
<rect x="36" y="60" width="188" height="150" rx="5" fill="#93c5fd"/>
<path d="M36 60 q47 -8 94 0 q47 8 94 0 v6 q-47 8 -94 0 q-47 -8 -94 0 Z" fill="#60a5fa"/>
<text x="130" y="140" font-size="17" font-weight="700" fill="#1e40af" text-anchor="middle">20 kWh</text>
<text x="130" y="158" font-size="10" fill="#1e40af" text-anchor="middle">BIGGER TANK</text>
<!-- pipe SAME -->
<rect x="230" y="180" width="90" height="24" fill="#404040"/>
<rect x="233" y="184" width="84" height="16" fill="#60a5fa"/>
<text x="275" y="222" font-size="11" font-weight="700" fill="#0a0a0a" text-anchor="middle">5 kW</text>
<text x="275" y="236" class="tiny" font-weight="700" fill="#dc2626" text-anchor="middle">SAME PIPE</text>
<rect x="30" y="256" width="240" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="150" y="274" class="mono" font-size="10.5" text-anchor="middle">t = 20 kWh / 5 kW</text>
<text x="150" y="292" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">4.0 hours</text>
</g>

<!-- Config 3: 10 kWh / 10 kW -->
<g transform="translate(720,0)">
<text x="130" y="0" class="hd" fill="#059669" text-anchor="middle">DOUBLE THE POWER</text>
<text x="130" y="20" font-size="15" font-weight="700" fill="#0a0a0a" text-anchor="middle">10 kWh / 10 kW</text>
<rect x="60" y="36" width="140" height="180" rx="8" fill="none" stroke="#059669" stroke-width="2.4"/>
<rect x="66" y="60" width="128" height="150" rx="5" fill="#bfdbfe"/>
<path d="M66 60 q32 -8 64 0 q32 8 64 0 v6 q-32 8 -64 0 q-32 -8 -64 0 Z" fill="#93c5fd"/>
<text x="130" y="140" font-size="17" font-weight="700" fill="#1e40af" text-anchor="middle">10 kWh</text>
<text x="130" y="158" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">SAME TANK</text>
<!-- pipe BIGGER -->
<rect x="200" y="168" width="90" height="48" fill="#404040"/>
<rect x="203" y="172" width="84" height="40" fill="#34d399"/>
<text x="245" y="234" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">10 kW</text>
<text x="245" y="248" class="tiny" font-weight="700" fill="#059669" text-anchor="middle">BIGGER PIPE</text>
<rect x="30" y="264" width="240" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="150" y="282" class="mono" font-size="10.5" text-anchor="middle">t = 10 kWh / 10 kW</text>
<text x="150" y="300" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">1.0 hour at 10 kW</text>
</g>
</g>

<!-- what the customer notices -->
<g transform="translate(40,442)">
<text x="0" y="0" class="hd" fill="#0a0a0a">WHAT THE CUSTOMER ACTUALLY NOTICES</text>
<line x1="0" y1="10" x2="1120" y2="10" stroke="#e5e5e5"/>
<g font-size="11">
<text x="0" y="32" font-weight="700" fill="#2563eb">More energy (bigger tank)</text>
<text x="330" y="32" fill="#404040">Lasts twice as long &#8212; but cannot run more appliances at the same time.</text>
<text x="0" y="56" font-weight="700" fill="#059669">More power (bigger pipe)</text>
<text x="330" y="56" fill="#404040">Runs twice as many appliances at once &#8212; but for half as long.</text>
<text x="0" y="80" font-weight="700" fill="#0a0a0a">Both are needed to get both.</text>
<text x="330" y="80" fill="#404040">Adding Energy Modules adds kWh. A larger Power Core adds kW. They are separate purchases.</text>
</g>
</g>

<!-- Precifarm mapping -->
<g transform="translate(40,548)">
<rect x="0" y="0" width="546" height="118" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="18" y="24" class="hd" fill="#1d4ed8">IN PRECIFARM TERMS</text>
<line x1="18" y1="32" x2="528" y2="32" stroke="#bfdbfe"/>
<text x="18" y="54" class="mono" font-size="11">MORE MODULES       &#8594;  MORE ENERGY (kWh)  &#8594;  longer runtime</text>
<text x="18" y="74" class="mono" font-size="11">LARGER POWER CORE  &#8594;  MORE POWER  (kW)   &#8594;  more simultaneous load</text>
<text x="18" y="100" font-size="10.5" fill="#404040">This is why Energy OS Screen 5 (Figure 13) tells the customer explicitly that adding a</text>
<text x="18" y="112" font-size="10.5" fill="#404040">battery gives longer backup, not stronger output.</text>
</g>

<!-- binding constraint table -->
<g transform="translate(614,548)">
<rect x="0" y="0" width="546" height="118" rx="7" fill="#fafafa" stroke="#e5e5e5"/>
<text x="18" y="24" class="hd" fill="#404040">THE BINDING CONSTRAINT MOVES  &#183;  POWER CORE = 4.8 kW</text>
<line x1="18" y1="32" x2="528" y2="32" stroke="#e5e5e5"/>
<g class="hd" fill="#737373" font-size="9">
<text x="18" y="48">MODULES</text><text x="150" y="48">BATTERY CEILING (AC)</text><text x="340" y="48">BINDING CONSTRAINT</text>
</g>
<g class="mono" font-size="10">
<text x="18" y="66">1</text><text x="150" y="66">2.41 kW</text><text x="340" y="66" font-weight="700" fill="#dc2626">BATTERY &#8212; Core over-specified</text>
<text x="18" y="82">2</text><text x="150" y="82">4.81 kW</text><text x="340" y="82" font-weight="700" fill="#059669">BALANCED &#8212; matched design point</text>
<text x="18" y="98">3</text><text x="150" y="98">7.22 kW</text><text x="340" y="98" font-weight="700" fill="#2563eb">POWER CORE</text>
<text x="18" y="114">4</text><text x="150" y="114">9.63 kW</text><text x="340" y="114" font-weight="700" fill="#2563eb">POWER CORE</text>
</g>
</g>

<text x="40" y="694" class="s" font-size="10.5">Figure 22 &#8212; Energy versus power. All runtimes CALCULATED as t = E / P, ignoring conversion losses for clarity of the principle; see Figure 15 for the corrected figures Precifarm quotes to customers.</text>
</svg>
