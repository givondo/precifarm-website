<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="'Segoe UI',system-ui,sans-serif" data-pf-theme="v2">
<defs>
<linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f8fafc"/>
  <stop offset="55%" stop-color="#ffffff"/>
  <stop offset="100%" stop-color="#f1f5f9"/>
</linearGradient>
<pattern id="pf-grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="0.75" fill="#e2e8f0"/>
</pattern>
<linearGradient id="pf-blue" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#3b82f6"/>
  <stop offset="100%" stop-color="#1d4ed8"/>
</linearGradient>
<linearGradient id="pf-blue-soft" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#eff6ff"/>
  <stop offset="100%" stop-color="#dbeafe"/>
</linearGradient>
<filter id="pf-shadow" x="-8%" y="-8%" width="116%" height="120%">
  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
</filter>
<filter id="pf-shadow-sm" x="-6%" y="-6%" width="112%" height="114%">
  <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
</filter></defs>
<style>
.t{fill:#0a0a0a}.s{fill:#737373}
.tiny{font-size:9.5px;fill:#737373}
.hd{font-size:10.5px;font-weight:700;letter-spacing:.1em}
.mono{font-size:10px;font-family:ui-monospace,Consolas,monospace;fill:#404040}
.ax{stroke:#404040;stroke-width:1.4}
.gr{stroke:#f0f0f0;stroke-width:1}

.pf-accent{fill:#2563eb}
.pf-frame{fill:none;stroke:#e2e8f0;stroke-width:1}
.bx,.dev{filter:url(#pf-shadow-sm)}
.bxb{filter:url(#pf-shadow);fill:#f8fbff}

</style>

<g id="pf-background" aria-hidden="true">
  <rect width="1200" height="720" fill="url(#pf-bg)"/>
  <rect width="1200" height="720" fill="url(#pf-grid)" opacity="0.45"/>
  <rect x="0" y="0" width="5" height="720" fill="#2563eb" rx="0"/>
</g><text x="40" y="44" class="t" font-size="22" font-weight="700">How many hours can Precifarm power the home?</text>
<text x="40" y="66" class="s" font-size="12.5">Three answers to the same question. Only one of them belongs in customer-facing material.</text>


<!-- equation strip -->
<rect x="40" y="98" width="1120" height="42" rx="6" fill="#f5f5f5" stroke="#e5e5e5"/>
<text x="56" y="116" class="hd" fill="#404040">GOVERNING RELATIONSHIP</text>
<text x="56" y="133" class="mono" font-size="11">t  =  E_usable / P_load               where   E_usable = E_nominal &#215; SOC window &#215; conversion efficiency</text>
<text x="700" y="116" class="tiny">Reserve and thermal derating reduce this further &#8212;</text>
<text x="700" y="130" class="tiny">which is the difference between the three bars below.</text>

<!-- ===== CHART: 2-module system ===== -->
<text x="40" y="176" class="hd" fill="#0a0a0a">HERO CASE  &#183;  2 ENERGY MODULES  &#183;  5.12 kWh NOMINAL  &#183;  P2-4.8</text>

<g transform="translate(110,200)">
<!-- axes -->
<line class="ax" x1="0" y1="300" x2="620" y2="300"/>
<line class="ax" x1="0" y1="300" x2="0" y2="10"/>
<!-- gridlines + y labels -->
<g>
<line class="gr" x1="0" y1="46" x2="620" y2="46"/><text x="-10" y="50" class="tiny" text-anchor="end">10 h</text>
<line class="gr" x1="0" y1="97" x2="620" y2="97"/><text x="-10" y="101" class="tiny" text-anchor="end">8 h</text>
<line class="gr" x1="0" y1="147" x2="620" y2="147"/><text x="-10" y="151" class="tiny" text-anchor="end">6 h</text>
<line class="gr" x1="0" y1="198" x2="620" y2="198"/><text x="-10" y="202" class="tiny" text-anchor="end">4 h</text>
<line class="gr" x1="0" y1="249" x2="620" y2="249"/><text x="-10" y="253" class="tiny" text-anchor="end">2 h</text>
<text x="-10" y="304" class="tiny" text-anchor="end">0</text>
</g>
<text x="-52" y="155" class="tiny" font-size="10.5" transform="rotate(-90 -52 155)" text-anchor="middle">BACKUP DURATION</text>

<!-- groups: 4 loads × 3 bars -->
<!-- group width 155, bar width 36, gap 6 -->
<g>
<!-- 500 W -->
<g transform="translate(20,0)">
<rect x="0" y="39" width="36" height="261" fill="#cbd5e1"/>
<rect x="42" y="80" width="36" height="220" fill="#60a5fa"/>
<rect x="84" y="137" width="36" height="163" fill="#1d4ed8" rx="3"/>
<text x="18" y="31" class="mono" font-size="10" text-anchor="middle" fill="#64748b">10.24</text>
<text x="60" y="72" class="mono" font-size="10" text-anchor="middle" fill="#2563eb">8.66</text>
<text x="102" y="129" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8">6.40</text>
<text x="60" y="322" font-size="12.5" font-weight="700" fill="#0a0a0a" text-anchor="middle">500 W</text>
<text x="60" y="337" class="tiny" text-anchor="middle">essential loads</text>
</g>
<!-- 1 kW -->
<g transform="translate(175,0)">
<rect x="0" y="170" width="36" height="130" fill="#cbd5e1"/>
<rect x="42" y="190" width="36" height="110" fill="#60a5fa"/>
<rect x="84" y="219" width="36" height="81" fill="#1d4ed8" rx="3"/>
<text x="18" y="162" class="mono" font-size="10" text-anchor="middle" fill="#64748b">5.12</text>
<text x="60" y="182" class="mono" font-size="10" text-anchor="middle" fill="#2563eb">4.33</text>
<text x="102" y="211" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8">3.20</text>
<text x="60" y="322" font-size="12.5" font-weight="700" fill="#0a0a0a" text-anchor="middle">1 kW</text>
<text x="60" y="337" class="tiny" text-anchor="middle">+ fridge, laptops</text>
</g>
<!-- 2 kW -->
<g transform="translate(330,0)">
<rect x="0" y="235" width="36" height="65" fill="#cbd5e1"/>
<rect x="42" y="245" width="36" height="55" fill="#60a5fa"/>
<rect x="84" y="259" width="36" height="41" fill="#1d4ed8" rx="3"/>
<text x="18" y="227" class="mono" font-size="10" text-anchor="middle" fill="#64748b">2.56</text>
<text x="60" y="237" class="mono" font-size="10" text-anchor="middle" fill="#2563eb">2.17</text>
<text x="102" y="251" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8">1.60</text>
<text x="60" y="322" font-size="12.5" font-weight="700" fill="#0a0a0a" text-anchor="middle">2 kW</text>
<text x="60" y="337" class="tiny" text-anchor="middle">+ pump or kettle</text>
</g>
<!-- 3 kW -->
<g transform="translate(485,0)">
<rect x="0" y="256" width="36" height="44" fill="#cbd5e1"/>
<rect x="42" y="263" width="36" height="37" fill="#60a5fa"/>
<rect x="84" y="273" width="36" height="27" fill="#1d4ed8" rx="3"/>
<text x="18" y="248" class="mono" font-size="10" text-anchor="middle" fill="#64748b">1.71</text>
<text x="60" y="255" class="mono" font-size="10" text-anchor="middle" fill="#2563eb">1.44</text>
<text x="102" y="265" class="mono" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8">1.07</text>
<text x="60" y="322" font-size="12.5" font-weight="700" fill="#0a0a0a" text-anchor="middle">3 kW</text>
<text x="60" y="337" class="tiny" text-anchor="middle">heavy simultaneous</text>
</g>
</g>
</g>

<!-- legend -->
<g transform="translate(770,208)">
<rect x="0" y="0" width="390" height="164" rx="7" fill="#fafafa" stroke="#e5e5e5"/>
<text x="18" y="24" class="hd" fill="#404040">THE THREE ANSWERS</text>
<line x1="18" y1="32" x2="372" y2="32" stroke="#e5e5e5"/>

<rect x="18" y="44" width="20" height="20" fill="#cbd5e1"/>
<text x="46" y="53" font-size="11" font-weight="700" fill="#64748b">THEORETICAL</text>
<text x="46" y="68" class="tiny">Nominal energy &#247; load. Ignores depth-of-discharge</text>
<text x="46" y="80" class="tiny">limits and conversion losses. Shown for contrast only.</text>

<rect x="18" y="92" width="20" height="20" fill="#60a5fa"/>
<text x="46" y="101" font-size="11" font-weight="700" fill="#2563eb">ENGINEERING ESTIMATE</text>
<text x="46" y="116" class="tiny">Usable AC energy &#247; load. 90 % SOC window,</text>
<text x="46" y="128" class="tiny">94 % conversion. The figure engineers should use.</text>

<rect x="18" y="132" width="20" height="20" fill="#1d4ed8" rx="3"/>
<text x="46" y="141" font-size="11" font-weight="700" fill="#1d4ed8">EXPECTED USABLE</text>
<text x="46" y="156" class="tiny">Also holds 20 % backup reserve and allows 5 % thermal</text>
</g>
<text x="816" y="380" class="tiny">derate. Quote this to customers &#8212; never the grey bar.</text>

<!-- worked example -->
<g transform="translate(770,396)">
<rect x="0" y="0" width="390" height="106" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="18" y="22" class="hd" fill="#1d4ed8">WORKED &#8212; 2 MODULES AT 1 kW  &#183;  [CALC]</text>
<text x="18" y="44" class="mono" font-size="10">E_expected = 5.12 &#215; 0.70 &#215; 0.94 &#215; 0.95</text>
<text x="18" y="60" class="mono" font-size="10">           = 3.20 kWh</text>
<text x="18" y="78" class="mono" font-size="10">t = 3.20 / 1.0 = 3.20 h</text>
<text x="18" y="96" class="tiny">versus 4.33 h engineering estimate and 5.12 h theoretical.</text>
</g>

<!-- full module table -->
<line x1="40" y1="574" x2="1160" y2="574" stroke="#e5e5e5"/>
<text x="40" y="598" class="hd" fill="#0a0a0a">ENGINEERING ESTIMATE ACROSS THE RANGE  &#183;  HOURS  &#183;  [CALC]</text>
<g transform="translate(40,608)">
<g class="hd" fill="#737373" font-size="9.5">
<text x="0" y="14">LOAD</text><text x="200" y="14" text-anchor="end">1 MODULE &#183; 2.17 kWh</text><text x="420" y="14" text-anchor="end">2 MODULES &#183; 4.33 kWh</text><text x="640" y="14" text-anchor="end">4 MODULES &#183; 8.66 kWh</text><text x="860" y="14" text-anchor="end">8 MODULES &#183; 17.33 kWh</text><text x="1120" y="14" text-anchor="end">POWER CEILING CHECK</text>
</g>
<line x1="0" y1="22" x2="1120" y2="22" stroke="#e5e5e5"/>
<g class="mono" font-size="10.5">
<text x="0" y="40" font-weight="700" fill="#0a0a0a">500 W</text><text x="200" y="40" text-anchor="end">4.33</text><text x="420" y="40" text-anchor="end">8.66</text><text x="640" y="40" text-anchor="end">17.33</text><text x="860" y="40" text-anchor="end">34.66</text><text x="1120" y="40" text-anchor="end" fill="#059669">all configurations OK</text>
<text x="0" y="58" font-weight="700" fill="#0a0a0a">1 kW</text><text x="200" y="58" text-anchor="end">2.17</text><text x="420" y="58" text-anchor="end">4.33</text><text x="640" y="58" text-anchor="end">8.66</text><text x="860" y="58" text-anchor="end">17.33</text><text x="1120" y="58" text-anchor="end" fill="#059669">all configurations OK</text>
<text x="0" y="76" font-weight="700" fill="#0a0a0a">2 kW</text><text x="200" y="76" text-anchor="end">1.08</text><text x="420" y="76" text-anchor="end">2.17</text><text x="640" y="76" text-anchor="end">4.33</text><text x="860" y="76" text-anchor="end">8.66</text><text x="1120" y="76" text-anchor="end" fill="#059669">1 module near its 2.41 kW limit</text>
<text x="0" y="94" font-weight="700" fill="#0a0a0a">3 kW</text><text x="200" y="94" text-anchor="end" fill="#dc2626" font-weight="700">exceeds limit</text><text x="420" y="94" text-anchor="end">1.44</text><text x="640" y="94" text-anchor="end">2.89</text><text x="860" y="94" text-anchor="end">5.78</text><text x="1120" y="94" text-anchor="end" fill="#dc2626">1 module cannot deliver 3 kW at all</text>
</g>
</g>

<line x1="40" y1="708" x2="1160" y2="708" stroke="#e5e5e5" stroke-width="0"/>
<text x="40" y="716" class="s" font-size="10.5">Figure 15 &#8212; Backup duration. Assumptions A-01 (90 % SOC window), A-02 (94 % conversion), A-04 (20 % reserve). Efficiency figures require validation by test T-28; if measured values differ, every number on this page changes (R-17).</text>
</svg>
