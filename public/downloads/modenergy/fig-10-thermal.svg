<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="'Segoe UI',system-ui,sans-serif" data-pf-theme="v2">
<style>
.t{fill:#0a0a0a}.s{fill:#737373}
.lbl{font-size:12.5px;font-weight:600;fill:#0a0a0a}
.tiny{font-size:9.5px;fill:#737373}
.mono{font-size:10px;font-family:ui-monospace,Consolas,monospace;fill:#404040}
.hd{font-size:10.5px;font-weight:700;letter-spacing:.1em}
.ax{stroke:#404040;stroke-width:1.4}
.gr{stroke:#e5e5e5;stroke-width:1}

.pf-accent{fill:#2563eb}
.pf-frame{fill:none;stroke:#e2e8f0;stroke-width:1}
.bx,.dev{filter:url(#pf-shadow-sm)}
.bxb{filter:url(#pf-shadow);fill:#f8fbff}

</style>
<defs>
<linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f8fafc"/>
  <stop offset="55%" stop-color="#ffffff"/>
  <stop offset="100%" stop-color="#f1f5f9"/>
</linearGradient>
<pattern id="pf-grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="0.75" fill="#e2e8f0"/>
</pattern>
<linearGradient id="pf-blue" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#3b82f6"/>
  <stop offset="100%" stop-color="#1d4ed8"/>
</linearGradient>
<linearGradient id="pf-blue-soft" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#eff6ff"/>
  <stop offset="100%" stop-color="#dbeafe"/>
</linearGradient>
<filter id="pf-shadow" x="-8%" y="-8%" width="116%" height="120%">
  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
</filter>
<filter id="pf-shadow-sm" x="-6%" y="-6%" width="112%" height="114%">
  <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
</filter>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
<linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#dc2626"/>
</linearGradient>
</defs>

<g id="pf-background" aria-hidden="true">
  <rect width="1200" height="740" fill="url(#pf-bg)"/>
  <rect width="1200" height="740" fill="url(#pf-grid)" opacity="0.45"/>
  <rect x="0" y="0" width="5" height="740" fill="#2563eb" rx="0"/>
</g><text x="40" y="42" class="t" font-size="20" font-weight="700">Thermal architecture</text>
<text x="40" y="64" class="s" font-size="12.5">Kenya is not one thermal environment. A shaded Nairobi interior and a sun-exposed outdoor cabinet differ by roughly 17 &#176;C &#8212; the design must survive the worse case.</text>


<!-- ===== LEFT: heat path ===== -->
<text x="40" y="112" class="hd" fill="#dc2626">HEAT PATH  &#183;  GENERATION &#8594; AMBIENT</text>
<g transform="translate(40,124)">
<rect x="0" y="0" width="330" height="66" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="16" y="24" class="lbl" fill="#991b1b">1 &#183; HEAT GENERATION</text>
<text x="16" y="42" class="mono">Module  P = I&#178;R = (50 A)&#178; &#215; 12 m&#937;  =  30 W  at 1.0 C</text>
<text x="16" y="58" class="mono">Power Core  P = P_out(1/&#183; &#8722; 1)     =  306 W  at 4.8 kW</text>
<path d="M165 66 V 92" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
<text x="178" y="84" class="tiny" fill="#991b1b">the electronics dominate &#8212; 10&#215; the module</text>

<rect x="0" y="92" width="330" height="58" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
<text x="16" y="116" class="lbl" fill="#991b1b">2 &#183; CELL / SEMICONDUCTOR JUNCTION</text>
<text x="16" y="134" class="tiny">Cell core temperature is not measured directly &#8212; NTC sensors read surface.</text>
<text x="16" y="146" class="tiny">Gradient between core and sensor is a validation item (T-03).</text>
<path d="M165 150 V 176" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>

<rect x="0" y="176" width="330" height="58" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.3"/>
<text x="16" y="200" class="lbl" fill="#9a3412">3 &#183; THERMAL PATH</text>
<text x="16" y="218" class="tiny">Cell &#8594; compression frame &#8594; thermal interface &#8594; spreader &#8594; enclosure wall.</text>
<text x="16" y="230" class="tiny">Power Core: junction &#8594; heatsink &#8594; ducted forced air.</text>
<path d="M165 234 V 260" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>

<rect x="0" y="260" width="330" height="58" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<text x="16" y="284" class="lbl" fill="#b45309">4 &#183; AIR / ENCLOSURE</text>
<text x="16" y="302" class="tiny">Filtered intake low, exhaust high. Filter loading progressively raises internal</text>
<text x="16" y="314" class="tiny">temperature &#8212; a slow failure mode Energy OS must detect as a trend (R-12).</text>
<path d="M165 318 V 344" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>

<rect x="0" y="344" width="330" height="58" rx="6" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="1.3"/>
<text x="16" y="368" class="lbl">5 &#183; AMBIENT</text>
<text x="16" y="386" class="tiny">Shade ambient is not the design input. Enclosure internal worst case is.</text>
<text x="16" y="398" class="tiny">Sun-exposed with no shield: +20 &#176;C over shade ambient.</text>
</g>

<!-- environment table -->
<g transform="translate(40,552)">
<text x="0" y="0" class="hd" fill="#404040">DESIGN WORST CASE BY LOCATION CLASS  &#183;  [ASSUMPTION]</text>
<g class="tiny" font-size="10">
<line x1="0" y1="10" x2="330" y2="10" stroke="#e5e5e5"/>
<text x="0" y="28" fill="#404040">Nairobi indoor &#183; 18&#8211;28 &#176;C, +5 &#176;C rise</text><text x="330" y="28" text-anchor="end" font-weight="700" fill="#0a0a0a">33 &#176;C</text>
<text x="0" y="46" fill="#404040">Nairobi outdoor, shaded &#183; +8 &#176;C rise</text><text x="330" y="46" text-anchor="end" font-weight="700" fill="#0a0a0a">38 &#176;C</text>
<text x="0" y="64" fill="#404040">Outdoor, sun-exposed, no shield &#183; +20 &#176;C</text><text x="330" y="64" text-anchor="end" font-weight="700" fill="#dc2626">50 &#176;C</text>
<text x="0" y="82" fill="#404040">Coastal / northern outdoor, shielded &#183; +12 &#176;C</text><text x="330" y="82" text-anchor="end" font-weight="700" fill="#dc2626">50 &#176;C</text>
<line x1="0" y1="92" x2="330" y2="92" stroke="#e5e5e5"/>
<text x="0" y="110" font-weight="700" fill="#0a0a0a">Qualification target: &#8722;5 &#176;C to +50 &#176;C internal</text>
</g>
</g>

<!-- ===== RIGHT: derating curve ===== -->
<text x="440" y="112" class="hd" fill="#2563eb">DERATING POLICY  &#183;  CURRENT LIMIT vs INTERNAL TEMPERATURE  &#183;  [PROPOSED]</text>
<g transform="translate(490,140)">
<!-- axes -->
<line class="ax" x1="0" y1="300" x2="600" y2="300"/>
<line class="ax" x1="0" y1="300" x2="0" y2="20"/>
<!-- gridlines -->
<g class="gr">
<line x1="0" y1="30" x2="600" y2="30"/><line x1="0" y1="98" x2="600" y2="98"/><line x1="0" y1="165" x2="600" y2="165"/><line x1="0" y1="232" x2="600" y2="232"/>
</g>
<!-- y labels -->
<g class="tiny" text-anchor="end" font-size="10">
<text x="-8" y="34">100%</text><text x="-8" y="102">80%</text><text x="-8" y="169">50%</text><text x="-8" y="236">30%</text><text x="-8" y="304">0%</text>
</g>
<text x="-40" y="170" class="tiny" font-size="10.5" transform="rotate(-90 -40 170)" text-anchor="middle">CURRENT LIMIT (% of rated)</text>
<!-- x labels -->
<g class="tiny" text-anchor="middle" font-size="10">
<text x="0" y="318">&#8722;5</text><text x="60" y="318">0</text><text x="130" y="318">5</text><text x="330" y="318">40</text><text x="420" y="318">45</text><text x="510" y="318">50</text><text x="580" y="318">55 &#176;C</text>
</g>
<text x="300" y="340" class="tiny" font-size="10.5" text-anchor="middle">INTERNAL TEMPERATURE</text>

<!-- bands -->
<rect x="130" y="20" width="200" height="280" fill="#ecfdf5" opacity=".7"/>
<rect x="330" y="20" width="90" height="280" fill="#fef3c7" opacity=".7"/>
<rect x="420" y="20" width="90" height="280" fill="#fed7aa" opacity=".7"/>
<rect x="510" y="20" width="90" height="280" fill="#fee2e2" opacity=".7"/>
<rect x="0" y="20" width="130" height="280" fill="#e0f2fe" opacity=".7"/>
<g class="tiny" font-size="9.5" font-weight="700" text-anchor="middle">
<text x="65" y="14" fill="#0369a1">COLD</text>
<text x="230" y="14" fill="#059669">NORMAL</text>
<text x="375" y="14" fill="#b45309">DERATE 1</text>
<text x="465" y="14" fill="#c2410c">DERATE 2</text>
<text x="555" y="14" fill="#dc2626">PROTECT</text>
</g>

<!-- discharge curve -->
<polyline points="0,165 60,165 130,98 330,30 420,98 510,165 510,300 600,300" fill="none" stroke="#2563eb" stroke-width="3"/>
<g fill="#2563eb"><circle cx="130" cy="98" r="4"/><circle cx="330" cy="30" r="4"/><circle cx="420" cy="98" r="4"/><circle cx="510" cy="165" r="4"/></g>
<!-- charge curve -->
<polyline points="0,300 60,300 60,232 130,98 330,30 420,130 510,220 510,300 600,300" fill="none" stroke="#059669" stroke-width="2.4" stroke-dasharray="7 4"/>
<!-- legend -->
<g transform="translate(340,244)">
<rect x="0" y="0" width="250" height="48" rx="5" fill="#fff" stroke="#e5e5e5"/>
<line x1="12" y1="16" x2="44" y2="16" stroke="#2563eb" stroke-width="3"/><text x="52" y="20" class="tiny" font-size="10">Discharge limit (50 A = 100%)</text>
<line x1="12" y1="36" x2="44" y2="36" stroke="#059669" stroke-width="2.4" stroke-dasharray="7 4"/><text x="52" y="40" class="tiny" font-size="10">Charge limit (30 A = 100%)</text>
</g>
<!-- annotation -->
<text x="66" y="286" class="tiny" font-size="9.5" fill="#0369a1">no charge</text>
<text x="66" y="297" class="tiny" font-size="9.5" fill="#0369a1">below 0 &#176;C</text>
</g>

<!-- cooling strategy table -->
<g transform="translate(490,500)">
<text x="0" y="0" class="hd" fill="#404040">COOLING STRATEGY BY PRODUCT</text>
<line x1="0" y1="10" x2="600" y2="10" stroke="#e5e5e5"/>
<g font-size="10">
<text x="0" y="30" font-weight="700" fill="#0a0a0a">P1 Go</text><text x="110" y="30" fill="#404040">Passive conduction + low-noise fan</text><text x="600" y="30" text-anchor="end" fill="#737373">noise and dust are the risks</text>
<text x="0" y="52" font-weight="700" fill="#0a0a0a">P2 Home</text><text x="110" y="52" fill="#404040">Modules passive &#183; Power Core ducted forced air</text><text x="600" y="52" text-anchor="end" fill="#737373">follows the 306 W / 30 W split</text>
<text x="0" y="74" font-weight="700" fill="#0a0a0a">Energy Module</text><text x="110" y="74" fill="#404040">Passive in P2 bay &#183; forced-air compatible in Pod</text><text x="600" y="74" text-anchor="end" fill="#737373">one design, two contexts</text>
<text x="0" y="96" font-weight="700" fill="#0a0a0a">Pod</text><text x="110" y="96" fill="#404040">Filtered forced air, separate plenums, sun shield</text><text x="600" y="96" text-anchor="end" fill="#737373">density + solar gain</text>
</g>
<rect x="0" y="112" width="600" height="46" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="14" y="132" font-size="10.5" font-weight="700" fill="#b45309">ERN-07 &#8212; v1.0's 15&#8211;40 &#176;C envelope understated the sun-exposed outdoor case.</text>
<text x="14" y="148" font-size="10" fill="#92400e">Revised to &#8722;5 to +50 &#176;C with the published derating table above. All thresholds TO VALIDATE by T-03.</text>
</g>

<line x1="40" y1="704" x2="1160" y2="704" stroke="#e5e5e5"/>
<text x="40" y="726" class="s" font-size="11">Figure 10 &#8212; Thermal architecture and derating policy. Loss figures are CALCULATED from assumptions A-02 and A-09 (&#167;16.1). Internal resistance of 12 m&#937; is an ASSUMPTION requiring validation.</text>
</svg>
