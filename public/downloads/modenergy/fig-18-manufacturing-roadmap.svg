<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="'Segoe UI',system-ui,sans-serif" data-pf-theme="v2">
<style>
.t{fill:#0a0a0a}.s{fill:#737373}
.tiny{font-size:9.5px;fill:#737373}
.hd{font-size:10.5px;font-weight:700;letter-spacing:.1em}

.pf-accent{fill:#2563eb}
.pf-frame{fill:none;stroke:#e2e8f0;stroke-width:1}
.bx,.dev{filter:url(#pf-shadow-sm)}
.bxb{filter:url(#pf-shadow);fill:#f8fbff}

</style>
<defs>
<linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f8fafc"/>
  <stop offset="55%" stop-color="#ffffff"/>
  <stop offset="100%" stop-color="#f1f5f9"/>
</linearGradient>
<pattern id="pf-grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="0.75" fill="#e2e8f0"/>
</pattern>
<linearGradient id="pf-blue" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#3b82f6"/>
  <stop offset="100%" stop-color="#1d4ed8"/>
</linearGradient>
<linearGradient id="pf-blue-soft" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#eff6ff"/>
  <stop offset="100%" stop-color="#dbeafe"/>
</linearGradient>
<filter id="pf-shadow" x="-8%" y="-8%" width="116%" height="120%">
  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
</filter>
<filter id="pf-shadow-sm" x="-6%" y="-6%" width="112%" height="114%">
  <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
</filter><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>

<g id="pf-background" aria-hidden="true">
  <rect width="1200" height="480" fill="url(#pf-bg)"/>
  <rect width="1200" height="480" fill="url(#pf-grid)" opacity="0.45"/>
  <rect x="0" y="0" width="5" height="480" fill="#2563eb" rx="0"/>
</g><text x="40" y="42" class="t" font-size="20" font-weight="700">Manufacturing localisation roadmap</text>
<text x="40" y="64" class="s" font-size="12.5">Precifarm has no manufacturing capability today. Stage 1 is the current position; every later stage is a FUTURE concept with an explicit gate.</text>


<g transform="translate(40,110)">
<!-- stage 1 CURRENT -->
<g>
<rect x="0" y="0" width="204" height="200" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="0" y="0" width="204" height="26" rx="8" fill="#2563eb"/><rect x="0" y="14" width="204" height="12" fill="#2563eb" rx="3"/>
<text x="14" y="18" font-size="10" font-weight="700" fill="#fff" letter-spacing=".1em">STAGE 1 &#183; IMPORT</text>
<rect x="130" y="34" width="62" height="18" rx="9" fill="#2563eb"/>
<text x="161" y="47" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">CURRENT</text>
<text x="14" y="48" font-size="12" font-weight="700" fill="#0a0a0a">Import</text>
<g class="tiny" font-size="10">
<text x="14" y="72" fill="#404040">Fully assembled modules and</text>
<text x="14" y="86" fill="#404040">Power Cores imported.</text>
<text x="14" y="108" fill="#404040">Local scope: installation kit,</text>
<text x="14" y="122" fill="#404040">commissioning, service.</text>
</g>
<line x1="14" y1="138" x2="190" y2="138" stroke="#bfdbfe"/>
<text x="14" y="156" class="hd" fill="#1d4ed8" font-size="8.5">GATE TO STAGE 2</text>
<text x="14" y="174" font-size="9.5" fill="#404040">Field reliability data from</text>
<text x="14" y="187" font-size="9.5" fill="#404040">&#8805; 100 units in service.</text>
</g>
<path d="M206 100 H 226" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ab)" fill="none"/>

<!-- stage 2 -->
<g transform="translate(228,0)">
<rect x="0" y="0" width="204" height="200" rx="8" fill="#fff" stroke="#a3a3a3" stroke-width="1.4" stroke-dasharray="6 3"/>
<rect x="0" y="0" width="204" height="26" rx="8" fill="#f5f5f5"/><rect x="0" y="14" width="204" height="12" fill="#f5f5f5"/>
<text x="14" y="18" font-size="10" font-weight="700" fill="#525252" letter-spacing=".1em">STAGE 2 &#183; SKD</text>
<rect x="150" y="34" width="42" height="18" rx="9" fill="#f5f5f5" stroke="#a3a3a3"/>
<text x="171" y="47" font-size="8.5" font-weight="700" fill="#737373" text-anchor="middle">FUTURE</text>
<text x="14" y="48" font-size="12" font-weight="700" fill="#0a0a0a">Semi-knocked-down</text>
<g class="tiny" font-size="10">
<text x="14" y="72" fill="#404040">Enclosure, harness, final</text>
<text x="14" y="86" fill="#404040">assembly and test in Kenya.</text>
<text x="14" y="108" fill="#404040">Cells and PCBs still imported.</text>
</g>
<line x1="14" y1="138" x2="190" y2="138" stroke="#e5e5e5"/>
<text x="14" y="156" class="hd" fill="#525252" font-size="8.5">GATE TO STAGE 3</text>
<text x="14" y="174" font-size="9.5" fill="#404040">Duty and logistics saving</text>
<text x="14" y="187" font-size="9.5" fill="#404040">proven; local test capability.</text>
</g>
<path d="M434 100 H 454" stroke="#a3a3a3" stroke-width="2" marker-end="url(#ab)" fill="none"/>

<!-- stage 3 -->
<g transform="translate(456,0)">
<rect x="0" y="0" width="204" height="200" rx="8" fill="#fff" stroke="#a3a3a3" stroke-width="1.4" stroke-dasharray="6 3"/>
<rect x="0" y="0" width="204" height="26" rx="8" fill="#f5f5f5"/><rect x="0" y="14" width="204" height="12" fill="#f5f5f5"/>
<text x="14" y="18" font-size="10" font-weight="700" fill="#525252" letter-spacing=".1em">STAGE 3 &#183; LOCAL ASSEMBLY</text>
<rect x="150" y="34" width="42" height="18" rx="9" fill="#f5f5f5" stroke="#a3a3a3"/>
<text x="171" y="47" font-size="8.5" font-weight="700" fill="#737373" text-anchor="middle">FUTURE</text>
<text x="14" y="48" font-size="12" font-weight="700" fill="#0a0a0a">Local assembly</text>
<g class="tiny" font-size="10">
<text x="14" y="72" fill="#404040">Module assembly line, batch</text>
<text x="14" y="86" fill="#404040">acceptance testing, local QA.</text>
<text x="14" y="108" fill="#404040">Busbars, thermal parts and</text>
<text x="14" y="122" fill="#404040">mechanical hardware localised.</text>
</g>
<line x1="14" y1="138" x2="190" y2="138" stroke="#e5e5e5"/>
<text x="14" y="156" class="hd" fill="#525252" font-size="8.5">GATE TO STAGE 4</text>
<text x="14" y="174" font-size="9.5" fill="#404040">Volume threshold reached;</text>
<text x="14" y="187" font-size="9.5" fill="#404040">KEBS batch conformity route.</text>
</g>
<path d="M662 100 H 682" stroke="#a3a3a3" stroke-width="2" marker-end="url(#ab)" fill="none"/>

<!-- stage 4 -->
<g transform="translate(684,0)">
<rect x="0" y="0" width="204" height="200" rx="8" fill="#fff" stroke="#a3a3a3" stroke-width="1.4" stroke-dasharray="6 3"/>
<rect x="0" y="0" width="204" height="26" rx="8" fill="#f5f5f5"/><rect x="0" y="14" width="204" height="12" fill="#f5f5f5"/>
<text x="14" y="18" font-size="10" font-weight="700" fill="#525252" letter-spacing=".1em">STAGE 4 &#183; LOCAL VALUE ADD</text>
<rect x="150" y="34" width="42" height="18" rx="9" fill="#f5f5f5" stroke="#a3a3a3"/>
<text x="171" y="47" font-size="8.5" font-weight="700" fill="#737373" text-anchor="middle">FUTURE</text>
<text x="14" y="48" font-size="12" font-weight="700" fill="#0a0a0a">Local value add</text>
<g class="tiny" font-size="10">
<text x="14" y="72" fill="#404040">Enclosure fabrication, harness</text>
<text x="14" y="86" fill="#404040">manufacture, local supplier base.</text>
<text x="14" y="108" fill="#404040">PCB assembly becomes viable.</text>
</g>
<line x1="14" y1="138" x2="190" y2="138" stroke="#e5e5e5"/>
<text x="14" y="156" class="hd" fill="#525252" font-size="8.5">GATE TO STAGE 5</text>
<text x="14" y="174" font-size="9.5" fill="#404040">Local content economics</text>
<text x="14" y="187" font-size="9.5" fill="#404040">demonstrably positive.</text>
</g>
<path d="M890 100 H 910" stroke="#a3a3a3" stroke-width="2" marker-end="url(#ab)" fill="none"/>

<!-- stage 5 -->
<g transform="translate(912,0)">
<rect x="0" y="0" width="204" height="200" rx="8" fill="#fff" stroke="#a3a3a3" stroke-width="1.4" stroke-dasharray="6 3"/>
<rect x="0" y="0" width="204" height="26" rx="8" fill="#f5f5f5"/><rect x="0" y="14" width="204" height="12" fill="#f5f5f5"/>
<text x="14" y="18" font-size="10" font-weight="700" fill="#525252" letter-spacing=".1em">STAGE 5 &#183; REGIONAL SCALE</text>
<rect x="150" y="34" width="42" height="18" rx="9" fill="#f5f5f5" stroke="#a3a3a3"/>
<text x="171" y="47" font-size="8.5" font-weight="700" fill="#737373" text-anchor="middle">FUTURE</text>
<text x="14" y="48" font-size="12" font-weight="700" fill="#0a0a0a">Regional scale</text>
<g class="tiny" font-size="10">
<text x="14" y="72" fill="#404040">Export to the East African</text>
<text x="14" y="86" fill="#404040">market from a Kenyan base.</text>
<text x="14" y="108" fill="#404040">Cells remain imported at every</text>
<text x="14" y="122" fill="#404040">stage shown here.</text>
</g>
<line x1="14" y1="138" x2="190" y2="138" stroke="#e5e5e5"/>
<text x="14" y="156" class="hd" fill="#525252" font-size="8.5">DEPENDENCY</text>
<text x="14" y="174" font-size="9.5" fill="#404040">Regional certification</text>
<text x="14" y="187" font-size="9.5" fill="#404040">recognition.</text>
</g>
</g>

<!-- BUY CUSTOMIZE OWN strip -->
<g transform="translate(40,336)">
<text x="0" y="0" class="hd" fill="#0a0a0a">THE DISCIPLINE THAT MAKES THIS WORK</text>
<line x1="0" y1="10" x2="1120" y2="10" stroke="#e5e5e5"/>
<g transform="translate(0,20)">
<rect x="0" y="0" width="360" height="76" rx="7" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="1.2"/>
<text x="16" y="22" font-size="12" font-weight="700" fill="#0a0a0a">BUY</text>
<text x="60" y="22" font-size="9.5" fill="#737373">commodity, multi-source, no advantage in owning</text>
<text x="16" y="42" font-size="10" fill="#404040">Cells &#183; BMS hardware &#183; contactors &#183; fuses &#183; connectors</text>
<text x="16" y="56" font-size="10" fill="#404040">Inverter and MPPT power stages &#183; MCUs &#183; radios &#183; sensors</text>
<text x="16" y="70" font-size="9.5" fill="#dc2626" font-weight="700">Cells dominate cost and are not localisable near-term.</text>
</g>
<g transform="translate(380,20)">
<rect x="0" y="0" width="360" height="76" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="16" y="22" font-size="12" font-weight="700" fill="#1d4ed8">CUSTOMIZE</text>
<text x="106" y="22" font-size="9.5" fill="#2563eb">Precifarm mechanical and integration</text>
<text x="16" y="42" font-size="10" fill="#404040">Module enclosure and compression frame &#183; P2 chassis</text>
<text x="16" y="56" font-size="10" fill="#404040">Pod cabinet &#183; thermal paths and ducting &#183; harnesses</text>
<text x="16" y="70" font-size="9.5" fill="#059669" font-weight="700">This is where local value is captured first &#8212; Stage 2.</text>
</g>
<g transform="translate(760,20)">
<rect x="0" y="0" width="360" height="76" rx="7" fill="#0a0a0a"/>
<text x="16" y="22" font-size="12" font-weight="700" fill="#fff">OWN</text>
<text x="60" y="22" font-size="9.5" fill="#a3a3a3">the defensible layer</text>
<text x="16" y="42" font-size="10" fill="#e5e5e5">Energy OS &#183; CAN schema and DBC &#183; PAYGO engine</text>
<text x="16" y="56" font-size="10" fill="#e5e5e5">Diagnostics &#183; service platform &#183; customer data</text>
<text x="16" y="70" font-size="9.5" fill="#60a5fa" font-weight="700">Product architecture and the energy experience.</text>
</g>
</g>

<text x="40" y="470" class="s" font-size="10.5">Figure 18 &#8212; Manufacturing localisation roadmap. Stages 2&#8211;5 are FUTURE concepts. No local manufacturing capability exists today and nothing above may be represented as existing. Durations are deliberately omitted (&#167;24).</text>
</svg>
