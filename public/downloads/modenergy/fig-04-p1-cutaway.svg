<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="'Segoe UI',system-ui,sans-serif" data-pf-theme="v2">
<defs>
<linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f8fafc"/>
  <stop offset="55%" stop-color="#ffffff"/>
  <stop offset="100%" stop-color="#f1f5f9"/>
</linearGradient>
<pattern id="pf-grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="0.75" fill="#e2e8f0"/>
</pattern>
<linearGradient id="pf-blue" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#3b82f6"/>
  <stop offset="100%" stop-color="#1d4ed8"/>
</linearGradient>
<linearGradient id="pf-blue-soft" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#eff6ff"/>
  <stop offset="100%" stop-color="#dbeafe"/>
</linearGradient>
<filter id="pf-shadow" x="-8%" y="-8%" width="116%" height="120%">
  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
</filter>
<filter id="pf-shadow-sm" x="-6%" y="-6%" width="112%" height="114%">
  <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
</filter></defs>
<style>
.t{fill:#0a0a0a}.s{fill:#737373}
.cal{stroke:#737373;stroke-width:.9;fill:none}
.n{font-size:10.5px;font-weight:700;fill:#fff}
.lb{font-size:11.5px;font-weight:600;fill:#0a0a0a}
.ld{font-size:10px;fill:#737373}
.ghost{fill:#fafafa;stroke:#262626;stroke-width:1.5;opacity:.9}

.pf-accent{fill:#2563eb}
.pf-frame{fill:none;stroke:#e2e8f0;stroke-width:1}
.bx,.dev{filter:url(#pf-shadow-sm)}
.bxb{filter:url(#pf-shadow);fill:#f8fbff}

</style>

<g id="pf-background" aria-hidden="true">
  <rect width="1200" height="620" fill="url(#pf-bg)"/>
  <rect width="1200" height="620" fill="url(#pf-grid)" opacity="0.45"/>
  <rect x="0" y="0" width="5" height="620" fill="#2563eb" rx="0"/>
</g><text x="40" y="42" class="t" font-size="20" font-weight="700">P1 Go &#8212; cutaway</text>
<text x="40" y="64" class="s" font-size="12.5">~1.0 kWh integrated portable unit. Transparent-shell view. CONCEPTUAL internal arrangement; no dimension engineered.</text>


<g transform="translate(120,130)">
<!-- outer shell ghosted -->
<rect x="0" y="40" width="420" height="290" rx="18" class="ghost"/>
<path d="M130 40 q80 -56 160 0" fill="none" stroke="#262626" stroke-width="9" stroke-linecap="round" opacity=".9"/>
<text x="210" y="24" font-size="10" fill="#737373" text-anchor="middle">TOP CARRY HANDLE &#183; fold-flat stainless bail &#183; TARGET &#8804; 12 kg TOTAL</text>

<!-- battery pack lower -->
<rect x="24" y="196" width="372" height="116" rx="6" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.4"/>
<g fill="#93c5fd" stroke="#1e40af" stroke-width=".8">
<rect x="36" y="208" width="42" height="92" rx="3"/><rect x="84" y="208" width="42" height="92" rx="3"/><rect x="132" y="208" width="42" height="92" rx="3"/><rect x="180" y="208" width="42" height="92" rx="3"/>
<rect x="228" y="208" width="42" height="92" rx="3"/><rect x="276" y="208" width="42" height="92" rx="3"/><rect x="324" y="208" width="60" height="92" rx="3"/>
</g>
<text x="210" y="260" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">INTEGRATED LiFePO&#8324; PACK &#183; ~1.0 kWh</text>
<text x="210" y="276" font-size="9.5" fill="#1e40af" text-anchor="middle">not the 2.56 kWh Energy Module &#8212; see &#167;4.1</text>

<!-- BMS strip -->
<rect x="24" y="176" width="372" height="16" rx="3" fill="#065f46"/>
<text x="210" y="188" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">BMS &#183; CELL PROTECTION &#183; SOC</text>

<!-- inverter/electronics upper right -->
<rect x="230" y="104" width="166" height="64" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="313" y="126" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">INVERTER 1.0 kW</text>
<text x="313" y="142" font-size="9.5" fill="#404040" text-anchor="middle">+ AC charger</text>
<text x="313" y="158" font-size="9.5" fill="#404040" text-anchor="middle">+ MPPT 100&#8211;200 W</text>

<!-- display -->
<rect x="24" y="104" width="120" height="64" rx="5" fill="#0a0a0a"/>
<text x="36" y="128" font-size="15" font-weight="700" fill="#fff">86%</text>
<text x="36" y="144" font-size="9" fill="#a3a3a3">7 h 20 min left</text>
<rect x="36" y="152" width="96" height="5" rx="2.5" fill="#404040"/><rect x="36" y="152" width="82" height="5" rx="2.5" fill="#2563eb"/>

<!-- fan / airflow -->
<circle cx="186" cy="136" r="24" fill="#fff" stroke="#0891b2" stroke-width="1.3"/>
<g stroke="#0891b2" stroke-width="1.3" fill="none"><path d="M186 118 q12 18 0 36"/><path d="M186 118 q-12 18 0 36"/><path d="M168 136 h36"/></g>
<text x="186" y="176" font-size="9" fill="#0891b2" text-anchor="middle">LOW-NOISE FAN</text>

<!-- I/O panel bottom -->
<rect x="24" y="316" width="372" height="0" fill="none"/>
<g transform="translate(0,336)">
<rect x="24" y="0" width="372" height="34" rx="5" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="1"/>
<g fill="none" stroke="#404040" stroke-width="1.3">
<circle cx="58" cy="17" r="11"/><circle cx="92" cy="17" r="11"/>
<rect x="118" y="11" width="16" height="11" rx="2.5"/><rect x="142" y="11" width="16" height="11" rx="2.5"/>
<rect x="170" y="11" width="18" height="9" rx="1.5"/><rect x="196" y="11" width="18" height="9" rx="1.5"/>
<circle cx="238" cy="17" r="9"/>
<rect x="266" y="9" width="24" height="15" rx="2"/>
</g>
<text x="58" y="46" font-size="8.5" fill="#737373" text-anchor="middle">230 V &#215;2</text>
<text x="126" y="46" font-size="8.5" fill="#737373" text-anchor="middle">USB-C &#215;2</text>
<text x="192" y="46" font-size="8.5" fill="#737373" text-anchor="middle">USB-A &#215;2</text>
<text x="238" y="46" font-size="8.5" fill="#737373" text-anchor="middle">12 V</text>
<text x="278" y="46" font-size="8.5" fill="#737373" text-anchor="middle">SOLAR IN</text>
<text x="330" y="46" font-size="8.5" fill="#737373" text-anchor="middle">12 V IN</text>
<text x="378" y="46" font-size="8.5" fill="#737373" text-anchor="middle">EV OUT*</text>
</g>
<!-- stand ghost -->
<g opacity=".55" transform="translate(60,420)">
<path d="M40 0 H 340 V 18 H 40 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
<path d="M60 18 V 42 H 120 V 18" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
<text x="210" y="36" font-size="9" fill="#64748b" text-anchor="middle">HOME STAND &#183; lifts off for carry</text>
</g>
</g>

<!-- callouts -->
<g>
<line class="cal" x1="130" y1="240" x2="620" y2="200"/><circle cx="634" cy="198" r="11" fill="#0a0a0a"/><text x="634" y="202" class="n" text-anchor="middle">A</text>
<line class="cal" x1="450" y1="266" x2="620" y2="256"/><circle cx="634" cy="254" r="11" fill="#0a0a0a"/><text x="634" y="258" class="n" text-anchor="middle">B</text>
<line class="cal" x1="440" y1="316" x2="620" y2="312"/><circle cx="634" cy="310" r="11" fill="#0a0a0a"/><text x="634" y="314" class="n" text-anchor="middle">C</text>
<line class="cal" x1="306" y1="266" x2="620" y2="368"/><circle cx="634" cy="366" r="11" fill="#0a0a0a"/><text x="634" y="370" class="n" text-anchor="middle">D</text>
<line class="cal" x1="200" y1="480" x2="620" y2="424"/><circle cx="634" cy="422" r="11" fill="#0a0a0a"/><text x="634" y="426" class="n" text-anchor="middle">E</text>
</g>

<g transform="translate(660,180)">
<text x="0" y="0" font-size="12" font-weight="700" fill="#0a0a0a" letter-spacing=".06em">CUTAWAY KEY</text>
<line x1="0" y1="10" x2="480" y2="10" stroke="#e5e5e5"/>
<text x="0" y="32" class="lb">A &#183; Integrated LiFePO&#8324; pack, ~1.0 kWh</text>
<text x="0" y="48" class="ld">Bottom-loaded for a low centre of gravity when carried. Usable AC energy 0.846 kWh (&#167;4.3).</text>
<text x="0" y="88" class="lb">B &#183; Battery management system</text>
<text x="0" y="104" class="ld">Cell protection and SOC estimation. Reports to Energy OS over the same telemetry schema as</text>
<text x="0" y="118" class="ld">P2 and Pod &#8212; one data contract across the whole family.</text>
<text x="0" y="144" class="lb">C &#183; Inverter, AC charger and solar MPPT</text>
<text x="0" y="160" class="ld">1.0 kW continuous target. Note: this is below the ~1.8 kW class benchmark &#8212; decision E-06 (&#167;25).</text>
<text x="0" y="200" class="lb">D &#183; Forced-air cooling</text>
<text x="0" y="216" class="ld">Low-noise fan. Kenyan homes are dust-exposed: filtered path required, and fan noise is a</text>
<text x="0" y="230" class="ld">product-acceptance risk for indoor evening use. TO VALIDATE (T-16).</text>
<text x="0" y="256" class="lb">E &#183; Customer I/O panel</text>
<text x="0" y="272" class="ld">2 &#215; 230 V Type G, 2 &#215; USB-C PD, 2 &#215; USB-A, 12 V, solar input. All outputs pass through</text>
<text x="0" y="286" class="ld">protection before reaching the customer. *EV emergency Type 2 lead is [FUTURE] &#8212; 1 kW max (&#167;4.3).</text>
<rect x="0" y="308" width="480" height="58" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="14" y="326" font-size="10.5" font-weight="700" fill="#b45309">P1 Go does NOT accept the 2.56 kWh Energy Module in Phase 1.</text>
<text x="14" y="342" font-size="10" fill="#92400e">It shares the platform's software, brand and account &#8212; not its storage hardware.</text>
</g>

<line x1="40" y1="576" x2="1160" y2="576" stroke="#e5e5e5"/>
<text x="40" y="598" class="s" font-size="11">Figure 4 &#8212; P1 Go cutaway. CONCEPTUAL. Component positions illustrate design intent only; no internal dimension has been engineered.</text>
</svg>
