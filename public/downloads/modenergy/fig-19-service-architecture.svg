<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="'Segoe UI',system-ui,sans-serif" data-pf-theme="v2">
<style>
.t{fill:#0a0a0a}.s{fill:#737373}
.tiny{font-size:9.5px;fill:#737373}
.hd{font-size:10.5px;font-weight:700;letter-spacing:.1em}
.mono{font-size:9.5px;font-family:ui-monospace,Consolas,monospace;fill:#404040}

.pf-accent{fill:#2563eb}
.pf-frame{fill:none;stroke:#e2e8f0;stroke-width:1}
.bx,.dev{filter:url(#pf-shadow-sm)}
.bxb{filter:url(#pf-shadow);fill:#f8fbff}

</style>
<defs>
<linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f8fafc"/>
  <stop offset="55%" stop-color="#ffffff"/>
  <stop offset="100%" stop-color="#f1f5f9"/>
</linearGradient>
<pattern id="pf-grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="0.75" fill="#e2e8f0"/>
</pattern>
<linearGradient id="pf-blue" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#3b82f6"/>
  <stop offset="100%" stop-color="#1d4ed8"/>
</linearGradient>
<linearGradient id="pf-blue-soft" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#eff6ff"/>
  <stop offset="100%" stop-color="#dbeafe"/>
</linearGradient>
<filter id="pf-shadow" x="-8%" y="-8%" width="116%" height="120%">
  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
</filter>
<filter id="pf-shadow-sm" x="-6%" y="-6%" width="112%" height="114%">
  <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
</filter><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>

<g id="pf-background" aria-hidden="true">
  <rect width="1200" height="620" fill="url(#pf-bg)"/>
  <rect width="1200" height="620" fill="url(#pf-grid)" opacity="0.45"/>
  <rect x="0" y="0" width="5" height="620" fill="#2563eb" rx="0"/>
</g><text x="40" y="42" class="t" font-size="20" font-weight="700">Service architecture &#8212; repair the module, do not replace the system</text>
<text x="40" y="64" class="s" font-size="12.5">African operating economics do not tolerate whole-system swap-outs. Every serviceable element must be replaceable with a hand tool, a phone and a spare module.</text>


<!-- technician workflow -->
<text x="40" y="112" class="hd" fill="#0a0a0a">TECHNICIAN WORKFLOW  &#183;  EIGHT STEPS  &#183;  TARGET &#8804; 30 MIN FOR A MODULE</text>
<g transform="translate(40,124)">
<g>
<!-- step boxes -->
<g>
<rect x="0" y="0" width="128" height="84" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<circle cx="20" cy="20" r="11" fill="#2563eb"/><text x="20" y="24" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="38" y="24" font-size="11" font-weight="700" fill="#1d4ed8">IDENTIFY</text>
<text x="12" y="46" class="tiny">Scan the QR code or tap</text>
<text x="12" y="58" class="tiny">NFC on the unit.</text>
<text x="12" y="76" class="mono" font-size="8.5">technician app</text>
</g>
<g transform="translate(140,0)">
<rect x="0" y="0" width="128" height="84" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<circle cx="20" cy="20" r="11" fill="#2563eb"/><text x="20" y="24" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="38" y="24" font-size="11" font-weight="700" fill="#1d4ed8">PULL HISTORY</text>
<text x="12" y="46" class="tiny">Fault history and per-module</text>
<text x="12" y="58" class="tiny">health from Energy OS.</text>
<text x="12" y="76" class="mono" font-size="8.5">works from cache offline</text>
</g>
<g transform="translate(280,0)">
<rect x="0" y="0" width="128" height="84" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<circle cx="20" cy="20" r="11" fill="#2563eb"/><text x="20" y="24" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="38" y="24" font-size="11" font-weight="700" fill="#1d4ed8">CONFIRM FRU</text>
<text x="12" y="46" class="tiny">Fault code &#8594; decision tree &#8594;</text>
<text x="12" y="58" class="tiny">likely field-replaceable unit.</text>
<text x="12" y="76" class="mono" font-size="8.5">every code has an action</text>
</g>
<g transform="translate(420,0)">
<rect x="0" y="0" width="128" height="84" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<circle cx="20" cy="20" r="11" fill="#dc2626"/><text x="20" y="24" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="38" y="24" font-size="11" font-weight="700" fill="#991b1b">ISOLATE</text>
<text x="12" y="46" class="tiny">Isolate per procedure and</text>
<text x="12" y="58" class="tiny">verify de-energised.</text>
<text x="12" y="76" class="mono" font-size="8.5">multimeter + lockout</text>
</g>
<g transform="translate(560,0)">
<rect x="0" y="0" width="128" height="84" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<circle cx="20" cy="20" r="11" fill="#2563eb"/><text x="20" y="24" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="38" y="24" font-size="11" font-weight="700" fill="#1d4ed8">REPLACE</text>
<text x="12" y="46" class="tiny">Swap the FRU, scan the new</text>
<text x="12" y="58" class="tiny">serial number.</text>
<text x="12" y="76" class="mono" font-size="8.5">lift rail assists (E-04)</text>
</g>
<g transform="translate(700,0)">
<rect x="0" y="0" width="128" height="84" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<circle cx="20" cy="20" r="11" fill="#2563eb"/><text x="20" y="24" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="38" y="24" font-size="11" font-weight="700" fill="#1d4ed8">SELF-TEST</text>
<text x="12" y="46" class="tiny">App triggers the device</text>
<text x="12" y="58" class="tiny">commissioning self-test.</text>
<text x="12" y="76" class="mono" font-size="8.5">pre-charge, CAN, contactor</text>
</g>
<g transform="translate(840,0)">
<rect x="0" y="0" width="128" height="84" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
<circle cx="20" cy="20" r="11" fill="#059669"/><text x="20" y="24" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<text x="38" y="24" font-size="11" font-weight="700" fill="#065f46">RE-PROVISION</text>
<text x="12" y="46" class="tiny">Energy OS updates the module</text>
<text x="12" y="58" class="tiny">registry and warranty.</text>
<text x="12" y="76" class="mono" font-size="8.5">automatic</text>
</g>
<g transform="translate(980,0)">
<rect x="0" y="0" width="128" height="84" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
<circle cx="20" cy="20" r="11" fill="#059669"/><text x="20" y="24" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<text x="38" y="24" font-size="11" font-weight="700" fill="#065f46">CLOSE</text>
<text x="12" y="46" class="tiny">Customer notified in plain</text>
<text x="12" y="58" class="tiny">language, ticket closed.</text>
<text x="12" y="76" class="mono" font-size="8.5">SMS + app</text>
</g>
</g>
<!-- connectors -->
<g stroke="#2563eb" stroke-width="1.6" fill="none">
<path d="M128 42 h10" marker-end="url(#ab)"/><path d="M268 42 h10" marker-end="url(#ab)"/><path d="M408 42 h10" marker-end="url(#ab)"/>
<path d="M548 42 h10" marker-end="url(#ab)"/><path d="M688 42 h10" marker-end="url(#ab)"/><path d="M828 42 h10" marker-end="url(#ab)"/><path d="M968 42 h10" marker-end="url(#ab)"/>
</g>
</g>

<!-- FRU table -->
<line x1="40" y1="240" x2="1160" y2="240" stroke="#e5e5e5"/>
<text x="40" y="266" class="hd" fill="#0a0a0a">FIELD-REPLACEABLE UNITS  &#183;  WHAT CAN BE FIXED WITHOUT TAKING THE SITE DOWN</text>
<g transform="translate(40,278)">
<g class="hd" fill="#737373" font-size="9">
<text x="0" y="14">UNIT</text><text x="260" y="14">REPLACEABLE BY</text><text x="470" y="14">DOWNTIME TARGET</text><text x="640" y="14">SYSTEM STAYS LIVE?</text>
</g>
<line x1="0" y1="22" x2="740" y2="22" stroke="#e5e5e5"/>
<g font-size="10.5">
<text x="0" y="42" font-weight="700" fill="#0a0a0a">Energy Module</text><text x="260" y="42" fill="#404040">Trained technician</text><text x="470" y="42" fill="#404040">&#8804; 30 min</text><text x="640" y="42" font-weight="700" fill="#059669">YES</text>
<text x="740" y="42" font-size="9.5" fill="#737373">other modules carry the load</text>
<text x="0" y="64" font-weight="700" fill="#0a0a0a">Cooling fan / filter</text><text x="260" y="64" fill="#404040">Trained technician</text><text x="470" y="64" fill="#404040">&#8804; 20 min</text><text x="640" y="64" font-weight="700" fill="#059669">YES</text>
<text x="740" y="64" font-size="9.5" fill="#737373">most common scheduled item</text>
<text x="0" y="86" font-weight="700" fill="#0a0a0a">Edge controller board</text><text x="260" y="86" fill="#404040">Certified technician</text><text x="470" y="86" fill="#404040">&#8804; 1 h</text><text x="640" y="86" font-weight="700" fill="#d97706">LOCAL SAFE MODE</text>
<text x="0" y="108" font-weight="700" fill="#0a0a0a">Power Core (P2)</text><text x="260" y="108" fill="#404040">Certified technician</text><text x="470" y="108" fill="#404040">&#8804; 2 h</text><text x="640" y="108" font-weight="700" fill="#dc2626">NO</text>
<text x="0" y="130" font-weight="700" fill="#0a0a0a">Pod Power Unit</text><text x="260" y="130" fill="#404040">Licensed contractor</text><text x="470" y="130" fill="#404040">&#8804; 4 h</text><text x="640" y="130" font-weight="700" fill="#dc2626">NO</text>
<text x="0" y="152" font-weight="700" fill="#737373">Cells within a module</text><text x="260" y="152" fill="#737373">Depot only</text><text x="470" y="152" fill="#737373">module returned</text><text x="640" y="152" fill="#737373">module out of service</text>
</g>
</g>

<!-- diagnostics requirements -->
<g transform="translate(820,278)">
<rect x="0" y="0" width="340" height="176" rx="7" fill="#0a0a0a"/>
<text x="18" y="26" class="hd" fill="#fff">SIX DIAGNOSTIC REQUIREMENTS</text>
<line x1="18" y1="34" x2="322" y2="34" stroke="#404040"/>
<g font-size="10" fill="#e5e5e5">
<text x="18" y="54" font-weight="700" fill="#60a5fa">Every fault has a code.</text><text x="18" y="66">Stable, documented, human-readable catalogue.</text>
<text x="18" y="86" font-weight="700" fill="#60a5fa">Every code has an action.</text><text x="18" y="98">Code &#8594; likely FRU &#8594; written procedure.</text>
<text x="18" y="118" font-weight="700" fill="#60a5fa">Module-level granularity.</text><text x="18" y="130">The fault names which module, by serial.</text>
<text x="18" y="150" font-weight="700" fill="#60a5fa">Remote-first.</text><text x="130" y="150">Target &#8805; 60 % triaged before dispatch.</text>
<text x="18" y="166" font-weight="700" fill="#60a5fa">Offline capable.</text><text x="140" y="166">Plus anti-fraud serial binding.</text>
</g>
</g>

<!-- why it matters -->
<g transform="translate(40,470)">
<rect x="0" y="0" width="740" height="88" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
<text x="18" y="24" class="hd" fill="#1d4ed8">WHY THIS IS AN ARCHITECTURE DECISION, NOT AN AFTERTHOUGHT</text>
<text x="18" y="46" font-size="10.5" fill="#404040">One module SKU means one spare part to stock upcountry, one test fixture, one training course and one</text>
<text x="18" y="60" font-size="10.5" fill="#404040">service procedure. A competitor shipping a monolithic 13.5 kWh unit must ship a whole replacement unit</text>
<text x="18" y="74" font-size="10.5" fill="#404040">to fix one bad cell group. Precifarm ships a 2.56 kWh module &#8212; and the customer keeps their power on.</text>
</g>
<g transform="translate(820,470)">
<rect x="0" y="0" width="340" height="88" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="18" y="24" class="hd" fill="#991b1b">R-13 &#183; THE REAL RISK</text>
<text x="18" y="44" font-size="10" fill="#7f1d1d">Service capability failing to scale with the</text>
<text x="18" y="58" font-size="10" fill="#7f1d1d">installed base is rated HIGH probability. The</text>
<text x="18" y="72" font-size="10" fill="#7f1d1d">workflow above is the mitigation &#8212; validated</text>
<text x="18" y="82" font-size="10" fill="#7f1d1d">by field metrics at P5.</text>
</g>

<text x="40" y="600" class="s" font-size="10.5">Figure 19 &#8212; Service architecture. Downtime figures are engineering TARGETS to be validated during the P3 Pod pilot and the P5 paid pilot. Module handling requires resolution of ERN-06 and decision E-04.</text>
</svg>
