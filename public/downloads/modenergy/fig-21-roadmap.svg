</g><text x="40" y="42" class="t" font-size="20" font-weight="700">Prototype to scale &#8212; eight phases, eight exit gates</text>
<text x="40" y="64" class="s" font-size="12.5">Durations are deliberately omitted. Certification and supplier-qualification lead times dominate the schedule and cannot be responsibly estimated before P0 completes and laboratory quotations are held.</text>


