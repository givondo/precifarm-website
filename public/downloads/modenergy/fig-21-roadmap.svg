<text x="16" y="38" font-size="10.5" fill="#7f1d1d">Nine of the 28 tests in &#167;23 require certified laboratories. Laboratory engagement is the longest lead item in the entire programme and must begin at <tspan font-weight="700">P2</tspan>, not at P4 &#8212; otherwise certification, not engineering, sets the launch date.</text>
