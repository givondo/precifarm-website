<g font-size="10.5">
<text x="0" y="30" font-weight="700" fill="#dc2626">ERN-01</text><text x="80" y="30" fill="#404040">P2 inverter / module power mismatch</text><text x="420" y="30" fill="#737373">Resolved by two-tier SKU (&#167;5.2)</text><text x="780" y="30" font-weight="700" fill="#2563eb">closes at P1</text>
<text x="0" y="50" font-weight="700" fill="#dc2626">ERN-03</text><text x="80" y="50" fill="#404040">51.2 V parallel scaling ceiling</text><text x="420" y="50" fill="#737373">Resolved by dual LV-48 / HV-S architecture (&#167;7.2)</text><text x="780" y="50" font-weight="700" fill="#2563eb">closes at P3</text>
<text x="0" y="70" font-weight="700" fill="#dc2626">ERN-06</text><text x="80" y="70" fill="#404040">Module handling mass</text><text x="420" y="70" fill="#737373">Three options defined; lift rail recommended (&#167;5.6)</text><text x="780" y="70" font-weight="700" fill="#2563eb">closes at P0</text>
</g>
