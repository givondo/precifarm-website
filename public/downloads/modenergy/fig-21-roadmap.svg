<text x="40" y="634" class="s" font-size="10.5">Figure 21 &#8212; Prototype-to-scale roadmap. P0 is the current position; no Precifarm product holds any certification and no product may lawfully be sold as a certified energy-storage system before the P4 gate.</text>
