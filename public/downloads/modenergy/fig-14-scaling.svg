<g class="tiny" font-size="9" text-anchor="middle">
<text x="700" y="206">0</text><text x="782" y="206">200</text><text x="864" y="206">400</text><text x="946" y="206">600</text><text x="1028" y="206">800</text><text x="1078" y="206">1000</text>
</g>
<!-- current danger zone -->
<rect x="782" y="212" width="296" height="318" fill="#fef2f2"/>
<text x="930" y="228" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">BEYOND PRACTICAL FOR THIS PRODUCT CLASS</text>
<g stroke="#f5f5f5" stroke-width="1">
<line x1="782" y1="212" x2="782" y2="530"/><line x1="864" y1="234" x2="864" y2="530"/><line x1="946" y1="234" x2="946" y2="530"/><line x1="1028" y1="234" x2="1028" y2="530"/>
</g>
<line x1="782" y1="212" x2="782" y2="530" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 3"/>

<!-- rows: y positions -->
