<text x="789" y="15" class="mono">200</text>
<text x="1150" y="15" class="mono" text-anchor="end" font-weight="700">9.63</text>
<rect x="836" y="0" width="200" height="20" rx="10" fill="#d97706"/>
<text x="936" y="14" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">LV-48 PRACTICAL CEILING</text>
</g>
