<text x="12" y="15" font-size="10" font-weight="700" fill="#991b1b">NOT ACCEPTABLE &#8212; ERN-03</text>
<text x="12" y="28" font-size="9.5" fill="#7f1d1d">A ~1,000 A DC bus in a residential or SME cabinet is not a viable design.</text>
</g>

<!-- axis labels -->
<text x="335" y="500" class="tiny" font-size="10.5" text-anchor="middle">NOMINAL ENERGY (kWh) &#8212; grows linearly, exactly as intended</text>
<text x="890" y="500" class="tiny" font-size="10.5" text-anchor="middle">DC BUS CURRENT (A) &#8212; grows linearly too, which is the problem</text>

<!-- ===== PANEL B: HV-S ===== -->
<line x1="40" y1="528" x2="1160" y2="528" stroke="#e5e5e5" stroke-width="1.4"/>
<text x="40" y="558" class="hd" fill="#2563eb">HV-S SERIES ARCHITECTURE  &#183;  PROPOSED IN v2.0 FOR POD &#8805; 5 MODULES  &#183;  BENCHMARKED TO ESTABLISHED PRACTICE</text>

<g transform="translate(40,574)">
<rect x="0" y="0" width="700" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<g class="hd" fill="#1d4ed8" font-size="9.5">
<text x="20" y="22">CONFIG</text><text x="150" y="22">NOMINAL V</text><text x="260" y="22">Ah</text><text x="330" y="22">ENERGY</text><text x="450" y="22">MAX CURRENT</text><text x="590" y="22">MAX DC kW</text>
</g>
<line x1="20" y1="30" x2="680" y2="30" stroke="#bfdbfe"/>
<g class="mono" font-size="10.5">
<text x="20" y="50">5 s</text><text x="150" y="50">256 V</text><text x="260" y="50">50</text><text x="330" y="50" font-weight="700">12.80 kWh</text><text x="450" y="50">50 A</text><text x="590" y="50">12.80</text>
<text x="20" y="72">8 s</text><text x="150" y="72">409.6 V</text><text x="260" y="72">50</text><text x="330" y="72" font-weight="700">20.48 kWh</text><text x="450" y="72">50 A</text><text x="590" y="72">20.48</text>
<text x="20" y="94">10 s</text><text x="150" y="94">512 V</text><text x="260" y="94">50</text><text x="330" y="94" font-weight="700">25.60 kWh</text><text x="450" y="94">50 A</text><text x="590" y="94">25.60</text>
<text x="20" y="116">10 s &#215; 2 p</text><text x="150" y="116">512 V</text><text x="260" y="116">100</text><text x="330" y="116" font-weight="700" fill="#2563eb">51.20 kWh</text><text x="450" y="116" font-weight="700" fill="#059669">100 A</text><text x="590" y="116">51.20</text>
</g>
<line x1="20" y1="128" x2="680" y2="128" stroke="#bfdbfe"/>
<text x="20" y="150" font-size="11.5" font-weight="700" fill="#0a0a0a">Same 51.2 kWh. Same 51.2 kW. One tenth of the current.</text>
<text x="20" y="168" class="mono">1,000 A  &#8594;  100 A        current reduction factor = 10&#215;        conductor and protection duty falls accordingly</text>
</g>

<!-- visual comparison -->
<g transform="translate(770,574)">
<rect x="0" y="0" width="390" height="180" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
<text x="20" y="24" class="hd" fill="#404040">51.2 kWh &#8212; TWO WAYS TO BUILD IT</text>
<line x1="20" y1="32" x2="370" y2="32" stroke="#e5e5e5"/>
<text x="20" y="54" font-size="10.5" font-weight="700" fill="#991b1b">LV-48 &#183; 20 modules in parallel</text>
<rect x="20" y="60" width="330" height="22" rx="3" fill="#991b1b"/>
<text x="185" y="75" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1,000 A  at  51.2 V</text>
<text x="20" y="100" class="tiny">Very large conductors, high-breaking-capacity fusing, significant</text>
<text x="20" y="112" class="tiny">I&#178;R loss, difficult arc-flash case.</text>
<text x="20" y="136" font-size="10.5" font-weight="700" fill="#065f46">HV-S &#183; 10 in series &#215; 2 strings</text>
<rect x="20" y="142" width="33" height="22" rx="3" fill="#059669"/>
<text x="62" y="157" font-size="10.5" font-weight="700" fill="#059669">100 A  at  512 V</text>
<text x="210" y="157" class="tiny">&#8212; but a higher safety class</text>
</g>

<!-- benchmark + caution -->
<g transform="translate(40,772)">
<rect x="0" y="0" width="556" height="62" rx="6" fill="#f5f5f5" stroke="#e5e5e5"/>
<text x="16" y="20" font-size="10.5" font-weight="700" fill="#404040">WHY THIS IS THE ESTABLISHED APPROACH  &#183;  [BENCHMARK]</text>
<text x="16" y="38" font-size="10" fill="#404040">A leading modular system uses a 2.56 kWh module at 102.4 V and stacks it in series to 512 V,</text>
<text x="16" y="52" font-size="10" fill="#404040">holding output current at 25 A per tower. Precifarm's 51.2 V module reaches the same place via 10s.</text>
</g>
<g transform="translate(620,772)">
<rect x="0" y="0" width="540" height="62" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1"/>
<text x="16" y="20" font-size="10.5" font-weight="700" fill="#991b1b">HV-S IS NOT A FREE WIN  &#183;  DECISION E-03, GATE P3</text>
<text x="16" y="38" font-size="10" fill="#7f1d1d">Isolation, creepage and clearance, insulation monitoring, arc protection, labelling and installer</text>
<text x="16" y="52" font-size="10" fill="#7f1d1d">competency all change. Certification scoping is required before any Pod commitment. [CERT]</text>
</g>

<line x1="40" y1="852" x2="1160" y2="852" stroke="#e5e5e5"/>
<text x="40" y="872" class="s" font-size="11">Figure 14 &#8212; Module scaling. All values CALCULATED per &#167;16.4 (E = V &#215; Ah, P = V &#215; I, usable AC = nominal &#215; 0.90 &#215; 0.94). Module count, voltage architecture, inverter architecture, protections and site requirements must all be validated before deployment.</text>
</svg>
