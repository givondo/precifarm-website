<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="'Segoe UI',system-ui,sans-serif" data-pf-theme="v2">
<style>
.t{fill:#0a0a0a}.s{fill:#737373}
.tiny{font-size:9.5px;fill:#737373}
.hd{font-size:10.5px;font-weight:700;letter-spacing:.1em}
.mono{font-size:10px;font-family:ui-monospace,Consolas,monospace;fill:#404040}
.n{font-size:12px;font-weight:700;fill:#0a0a0a}

.pf-accent{fill:#2563eb}
.pf-frame{fill:none;stroke:#e2e8f0;stroke-width:1}
.bx,.dev{filter:url(#pf-shadow-sm)}
.bxb{filter:url(#pf-shadow);fill:#f8fbff}

</style>
<defs>
<linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#f8fafc"/>
  <stop offset="55%" stop-color="#ffffff"/>
  <stop offset="100%" stop-color="#f1f5f9"/>
</linearGradient>
<pattern id="pf-grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="0.75" fill="#e2e8f0"/>
</pattern>
<linearGradient id="pf-blue" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#3b82f6"/>
  <stop offset="100%" stop-color="#1d4ed8"/>
</linearGradient>
<linearGradient id="pf-blue-soft" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#eff6ff"/>
  <stop offset="100%" stop-color="#dbeafe"/>
</linearGradient>
<filter id="pf-shadow" x="-8%" y="-8%" width="116%" height="120%">
  <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
</filter>
<filter id="pf-shadow-sm" x="-6%" y="-6%" width="112%" height="114%">
  <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
</filter><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>

<g id="pf-background" aria-hidden="true">
  <rect width="1200" height="880" fill="url(#pf-bg)"/>
  <rect width="1200" height="880" fill="url(#pf-grid)" opacity="0.45"/>
  <rect x="0" y="0" width="5" height="880" fill="#2563eb" rx="0"/>
</g><text x="40" y="42" class="t" font-size="20" font-weight="700">Module scaling &#8212; and why current is the constraint nobody mentions</text>
<text x="40" y="64" class="s" font-size="12.5">Energy grows linearly with module count. In a parallel low-voltage architecture, so does current &#8212; and that is what breaks the design.</text>


<!-- headline strip -->
<rect x="40" y="96" width="1120" height="34" rx="17" fill="#eff6ff" fill="url(#pf-blue-soft)" stroke="#2563eb" stroke-width="1.2"/>
<text x="600" y="119" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2563eb" letter-spacing=".1em">ADD kWh WITHOUT REPLACING THE ENERGY MODULE</text>

<!-- ===== PANEL A: LV-48 parallel ===== -->
<text x="40" y="164" class="hd" fill="#0a0a0a">LV-48 PARALLEL ARCHITECTURE  &#183;  51.2 V NOMINAL  &#183;  AS DESCRIBED IN v1.0</text>
<line x1="40" y1="172" x2="1160" y2="172" stroke="#e5e5e5"/>

<g class="hd" fill="#737373" font-size="9.5">
<text x="40" y="192">MODULES</text>
<text x="130" y="192">ENERGY (kWh)</text>
<text x="612" y="192">USABLE AC</text>
<text x="700" y="192">DC BUS CURRENT (A)</text>
<text x="1096" y="192">MAX AC kW</text>
</g>

<!-- energy scale ticks -->
